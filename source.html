<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time Slice Coffee Source Signal</title>
    <style>
      :root {
        --ink: #171717;
        --muted: rgba(23, 23, 23, 0.62);
        --paper: #f7f4ec;
        --line: rgba(23, 23, 23, 0.16);
        --white: #fffdfa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, Arial, "Microsoft YaHei", sans-serif;
        margin: 0;
        padding: 32px 18px 48px;
      }

      main {
        margin: 0 auto;
        max-width: 760px;
      }

      .source-card {
        background: var(--white);
        border: 1px solid var(--line);
        box-shadow: 0 18px 42px rgba(23, 23, 23, 0.08);
        padding: clamp(22px, 4vw, 42px);
      }

      .brand {
        display: grid;
        gap: 8px;
        margin-bottom: 28px;
        text-transform: uppercase;
      }

      .brand strong {
        font-size: 14px;
        letter-spacing: 0.08em;
      }

      .brand span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      h1 {
        font-size: clamp(28px, 6vw, 48px);
        line-height: 1.08;
        margin: 0 0 16px;
      }

      .meta {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 13px;
        font-weight: 750;
        gap: 8px 14px;
        margin-bottom: 26px;
      }

      section {
        border-top: 1px solid var(--line);
        display: grid;
        gap: 8px;
        padding: 18px 0;
      }

      h2 {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.12em;
        margin: 0;
        text-transform: uppercase;
      }

      p,
      pre {
        font-size: 16px;
        line-height: 1.62;
        margin: 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        word-break: break-word;
      }

      pre {
        background: rgba(23, 23, 23, 0.04);
        border: 1px solid var(--line);
        padding: 12px;
      }

      a {
        color: var(--ink);
        font-weight: 850;
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .empty {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <article class="source-card" id="source-root">
        <div class="brand">
          <strong>Time Slice Coffee</strong>
          <span>Source Signal</span>
        </div>
        <p class="empty">Loading source signal...</p>
      </article>
    </main>
    <script type="module" src="./source.js"></script>
  </body>
</html>
